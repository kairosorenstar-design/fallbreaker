if(p.explosive)explode(Math.floor(cy/S),Math.floor(cx/S));
if(p.fake){toastOnce('fake','Bloque falso','Bloque falso: no cuenta para la meta del nivel.');beep(160,.15,'sawtooth',.06);return}
g.dest++;g.combo++;
const mult=1+Math.min(4,g.combo-1)*.15;g.score+=Math.round(p.max*50*mult);
vib(25);beep(600,.12,'square',.06);if(g.combo>=3)toast('¡Combo x'+g.combo+'!');
maybePower(cx,cy);if(g.dest>=g.c.goal)win()}}
function explode(r,c){beep(90,.2,'sawtooth',.09);vib(35);const full=Math.random()<.5;
[[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr,dc])=>{const nr=r+dr,nc=c+dc;if(nr<0||nr>=R||nc<0||nc>=C)return;const nb=g.grid[nr][nc];if(!nb)return;
const dmg=full?nb.hp:2+(Math.random()<.5?0:1);
for(let i=0;i<dmg;i++){if(nb.hp<=0)break;hit(nb,nc*S+S/2,nr*S+S/2)}});
toastOnce('explosion',full?'¡Explosión total!':'¡Explosión!',(full?'¡Explosión total! ':'¡Explosión! ')+'Los bloques explosivos dañan a los vecinos al destruirse.')}
function caps(){const px=pad(),pw=padW();
for(let i=g.caps.length-1;i>=0;i--){const cp=g.caps[i];cp.y+=cp.vy;
if(cp.y+cp.r>=PY&&cp.y-cp.r<=PY+10&&Math.abs(cp.x-px)<pw/2+cp.r){let firstCap=true;try{firstCap=!localStorage.getItem('tb_seen_cap');if(firstCap)localStorage.setItem('tb_seen_cap','1')}catch(e){}
applyEffect(cp.type);if(firstCap)toast('¡Cápsula! Da poderes o desventajas al atraparla con la barra.',3200);
beep(cp.pos?520:260,.1,'triangle',.06);g.caps.splice(i,1)}
else if(cp.y>H+cp.r)g.caps.splice(i,1)}}
function padW(){return g.c.pw*(performance.now()<g.eff.padUntil?g.eff.padMult:1)}
function pad(){const w=padW();let px=mx;if(performance.now()<g.eff.invUntil)px=W-mx;return Math.max(w/2,Math.min(W-w/2,px))}
function moveBall(b){const px=pad(),pw=padW();
if(b===g.b&&b.on){b.x=px;b.y=PY-8;return false}
for(let s=0;s<2;s++){b.x+=b.vx/2;b.y+=b.vy/2;
if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)}if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)}
if(b.y<FY+b.r){const c0=Math.max(0,(b.x-b.r)/S|0),c1=Math.min(C-1,(b.x+b.r)/S|0),r0=Math.max(0,(b.y-b.r)/S|0),r1=Math.min(R-1,(b.y+b.r)/S|0);
out:for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){const p=g.grid[r][c];if(!p)continue;
const nx=Math.max(c*S,Math.min(b.x,c*S+S)),ny=Math.max(r*S,Math.min(b.y,r*S+S)),dx=b.x-nx,dy=b.y-ny;
if(dx*dx+dy*dy<b.r*b.r){const d=Math.hypot(dx,dy);
if(!d){b.vy=-b.vy}else{b.x=nx+dx/d*b.r;b.y=ny+dy/d*b.r;if(Math.abs(dx)>Math.abs(dy))b.vx=Math.sign(dx)*Math.abs(b.vx);else b.vy=Math.sign(dy)*Math.abs(b.vy)}
hit(p,c*S+S/2,r*S+S/2);break out}}}
if(b.vy>0&&b.y+b.r>=PY&&b.y-b.r<PY+10&&Math.abs(b.x-px)<pw/2+b.r){const a=Math.max(-1,Math.min(1,(b.x-px)/(pw/2)))*1.05,sp=curSpeed();b.vx=sp*Math.sin(a);b.vy=-sp*Math.cos(a);b.y=PY-b.r;beep(220,.05,'triangle',.05)}
if(b.y>H+b.r)return true}
return false}
function update(){if(g.st!='play'||paused)return;
if(g.c.infinite){const mins=(performance.now()-g.infT0)/60000,tier=mins<2?0:mins<5?1:mins<9?2:mins<14?3:4;
g.c.sp=Math.min(9,4.2+mins*.35);g.c.drop=Math.max(140,900-mins*40);g.c.pw=Math.max(50,90-mins*3);
if(g.c.t!=tier){g.c.t=tier;g.c.pool=POOLS[tier];g.c.name=NAMES[tier];cv.style.background=TIERBG[tier];beep(500,.2,'triangle',.07);toast('Dificultad: '+NAMES[tier])}}
g.t+=1000/60;const k=(keys.ArrowDown||touchFast)?40:g.c.drop;
if(g.t>=k){g.t=0;const p=g.cur;if(fits(p.cs,p.px,p.py+1))p.py++;else{lock(p.cs,p.px,p.py,p.fake,p.key,p.explosive);if(g.st=='play')spawn()}}
for(let i=g.balls.length-1;i>=0;i--)if(moveBall(g.balls[i])||performance.now()>g.balls[i].until)g.balls.splice(i,1);
if(moveBall(g.b)){if(g.balls.length>0){const nb=g.balls.shift();g.b.x=nb.x;g.b.y=nb.y;g.b.vx=nb.vx;g.b.vy=nb.vy;g.b.on=0}
else{g.lives--;g.combo=0;g.flash=performance.now();g.b.on=1;g.b.vx=g.b.vy=0;vib([40,30,40]);beep(120,.25,'sawtooth',.08);if(g.lives<=0){over();return}}}
caps()}
function draw(){if(paused){x.fillStyle='#0d1022cc';x.fillRect(0,0,W,H);x.fillStyle='#ffb020';x.font='bold 22px Chakra Petch,sans-serif';x.textAlign='center';x.fillText('PAUSADO',W/2,H/2);return}
x.clearRect(0,0,W,H);x.strokeStyle='#ffffff1c';x.lineWidth=2;
for(let i=1;i<C;i++){x.beginPath();x.moveTo(i*S,0);x.lineTo(i*S,FY);x.stroke()}
for(let j=1;j<R;j++){x.beginPath();x.moveTo(0,j*S);x.lineTo(W,j*S);x.stroke()}
x.fillStyle='#ffb02033';x.fillRect(0,FY-2,W,4);
const cell=(c,r,p,al)=>{const intro=g.c.n===6,sf=p.fake&&intro,sx=p.explosive&&intro;x.globalAlpha=al;x.fillStyle=COL[p.type]||COL.LN;x.fillRect(c*S+1,r*S+1,S-2,S-2);x.globalAlpha=1;
if(sf){x.setLineDash([3,2]);x.strokeStyle='#8e95c4';x.lineWidth=2.5}else if(sx){x.setLineDash([]);x.strokeStyle='#ff4500';x.lineWidth=3.5}else{x.setLineDash([]);x.strokeStyle='#0d1022';x.lineWidth=2.5}
x.strokeRect(c*S+1.25,r*S+1.25,S-2.5,S-2.5);x.setLineDash([]);
if(!p.isLine||c===(C>>1)){x.fillStyle='#0d1022';x.font='bold 13px Chakra Petch,sans-serif';x.textAlign='center';x.fillText(sf?'?':p.hp,c*S+S/2,r*S+S/2+5)}};
g.grid.forEach((row,r)=>row.forEach((p,c)=>p&&cell(c,r,p,.55+.45*p.hp/p.max)));
const q=g.cur;if(q&&g.st=='play'){let gy=q.py;while(fits(q.cs,q.px,gy+1))gy++;
x.strokeStyle='#ffffff55';x.lineWidth=2;q.cs.forEach(([a,b])=>x.strokeRect((q.px+a)*S+2,(gy+b)*S+2,S-4,S-4));
const qx=q.explosive&&g.c.n===6;q.cs.forEach(([a,b])=>{x.fillStyle=COL[q.key];x.globalAlpha=.9;x.fillRect((q.px+a)*S+1,(q.py+b)*S+1,S-2,S-2);x.globalAlpha=1;x.strokeStyle=qx?'#ff4500':'#0d1022';x.lineWidth=qx?3.5:2.5;x.strokeRect((q.px+a)*S+1.25,(q.py+b)*S+1.25,S-2.5,S-2.5)})}
g.caps.forEach(cp=>{x.fillStyle=cp.pos?'#9be564':'#ef6f6f';x.beginPath();x.arc(cp.x,cp.y,cp.r,0,7);x.fill();x.fillStyle='#0d1022';x.font='bold 11px Chakra Petch,sans-serif';x.textAlign='center';x.fillText(CLET[cp.type],cp.x,cp.y+4)});
const px=pad(),pw=padW();x.fillStyle='#eef0ff';x.beginPath();x.roundRect(px-pw/2,PY,pw,10,5);x.fill();
x.fillStyle='#ffb020';x.beginPath();x.arc(g.b.x,g.b.y,g.b.r,0,7);x.fill();
g.balls.forEach(eb=>{x.beginPath();x.arc(eb.x,eb.y,eb.r,0,7);x.fill()});
if(g.b.on&&g.st=='play'){x.fillStyle='#b8bfe8';x.font='13px Chakra Petch,sans-serif';x.textAlign='center';x.fillText('Clic o espacio para lanzar',W/2,PY-40)}
if(g.msg){if(performance.now()<g.msg.until){x.fillStyle='#ffb020';x.font='bold 14px Chakra Petch,sans-serif';x.textAlign='center';x.fillText(g.msg.text,W/2,FY+26)}else g.msg=null}
const now=performance.now();let by=6;x.font='bold 11px Chakra Petch,sans-serif';x.textAlign='left';
if(now<g.eff.padUntil){x.fillStyle=g.eff.padMult>1?'#9be564':'#ef6f6f';x.fillText(g.eff.padMult>1?'BARRA ANCHA':'BARRA CORTA',6,by+10);by+=16}
if(now<g.eff.invUntil){x.fillStyle='#ef6f6f';x.fillText('INVERTIDO',6,by+10);by+=16}
if(g.flash&&now-g.flash<300){x.fillStyle='rgba(239,111,111,'+(.35*(1-(now-g.flash)/300))+')';x.fillRect(0,0,W,H)}
$('hl').textContent=g.c.nDisplay||g.c.n;$('hd').textContent=g.c.name;$('hn').textContent=(g.next||'').toString().toUpperCase();$('hv').textContent=g.lives;$('hg').textContent=g.c.goal===Infinity?g.dest:g.dest+'/'+g.c.goal;$('hg').style.color=(g.c.goal-g.dest<=1)?'#ffb020':'';$('hs').textContent=g.score}
function loop(t){if(!g||paused)return;acc+=Math.min(100,t-last);last=t;while(acc>=1000/60){update();acc-=1000/60}draw();if(g&&g.st=='play'&&!paused)requestAnimationFrame(loop);else if(g)draw()}
addEventListener('keydown',e=>{if(!g||g.st!='play')return;if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();if(e.key=='p'||e.key=='P'||e.key=='Escape'){togglePause();return}if(paused)return;keys[e.key]=1;const p=g.cur;
if(e.key.startsWith('Arrow'))e.preventDefault();
if(e.key=='ArrowLeft'&&fits(p.cs,p.px-1,p.py))p.px--;
if(e.key=='ArrowRight'&&fits(p.cs,p.px+1,p.py))p.px++;
if(e.key=='ArrowUp')rotatePiece();
if(e.key==' '){e.preventDefault();launch()}});
addEventListener('keyup',e=>delete keys[e.key]);
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();mx=(e.clientX-r.left)/r.width*W});
cv.addEventListener('mousedown',launch);
let touch=null;
function tpt(e){const r=cv.getBoundingClientRect(),t=e.touches[0];return{x:(t.clientX-r.left)/r.width*W,y:(t.clientY-r.top)/r.height*H}}
cv.addEventListener('touchstart',e=>{e.preventDefault();const p=tpt(e),zone=p.y>=FY?'pad':'piece';touch={sx:p.x,sy:p.y,moved:false,zone};if(zone=='pad')mx=p.x},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();if(!touch)return;const p=tpt(e);
if(touch.zone=='pad'){mx=p.x;touch.moved=true;return}
if(!g||g.st!='play'||paused)return;const cp=g.cur,dx=p.x-touch.sx,dy=p.y-touch.sy,STEP=26;
if(Math.abs(dy)>Math.abs(dx)&&dy>STEP){touchFast=true;touch.sy=p.y;touch.moved=true}
else if(Math.abs(dx)>STEP){const dir=dx>0?1:-1;if(fits(cp.cs,cp.px+dir,cp.py))cp.px+=dir;touch.sx=p.x;touch.moved=true}},{passive:false});
cv.addEventListener('touchend',e=>{e.preventDefault();if(touch&&!touch.moved&&!paused){if(g&&g.b.on)launch();if(touch.zone=='piece')rotatePiece()}touchFast=false;touch=null},{passive:false});
cv.addEventListener('touchcancel',()=>{touchFast=false;touch=null});
menu();
</script>
